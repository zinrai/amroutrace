tests:
  - name: "silenced has no receiver"
    labels:
      action: "drop"
    expected_receivers: []

  - name: "single receiver"
    labels:
      severity: "info"
    expected_receivers:
      - "receiver-a"

  - name: "fan out via continue"
    labels:
      severity: "warning"
    expected_receivers:
      - "receiver-a"
      - "receiver-b"

  - name: "nested route"
    labels:
      severity: "critical"
      kind: "recovery"
    expected_receivers:
      - "receiver-c"
